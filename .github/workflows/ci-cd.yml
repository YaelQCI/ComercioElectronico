name: Validar y desplegar en EC2

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas y compilación
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar configuración temporal de pruebas
        shell: bash
        run: |
          umask 077
          printf 'DOCKER_POSTGRES_PASSWORD=%s\nDOCKER_AUTH_SECRET=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -base64 32)" > "$RUNNER_TEMP/ci.env"
      - name: Validar scripts de despliegue
        run: |
          bash -n deploy/*.sh
          bash scripts/check-deployment.sh
      - name: Validar el workflow
        run: docker run --rm -i --network none rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -no-color - < .github/workflows/ci-cd.yml
      - name: Probar con PostgreSQL aislado
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" -f compose.docker.yaml --profile tests run --rm --build tests
      - name: Comprobar catálogo e imágenes de la migración
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" -f compose.docker.yaml --profile tests run --rm --no-deps tests node scripts/prepare-demo-catalog.mjs
      - name: Compilar imagen de ejecución
        run: docker build --target runtime --tag fitness-ci:validation .
      - name: Probar Compose de EC2 y sesiones HTTPS en aislamiento
        run: bash scripts/check-ec2-compose.sh
      - name: Limpiar únicamente el entorno efímero de CI
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" -f compose.docker.yaml --profile tests down --remove-orphans

  publish:
    name: Publicar imágenes del commit
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.event_name != 'pull_request' && vars.EC2_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.images.outputs.app_image }}
      tools_image: ${{ steps.images.outputs.tools_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Autenticar GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publicar aplicación y herramientas con referencias por digest
        id: images
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --use
          for target in tools runtime; do
            docker buildx build --platform linux/amd64 --target "$target" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$image/$target:$GITHUB_SHA" --metadata-file "$RUNNER_TEMP/$target.json" --push .
          done
          printf 'app_image=%s\n' "$image/runtime@$(jq -r '.["containerimage.digest"]' "$RUNNER_TEMP/runtime.json")" >> "$GITHUB_OUTPUT"
          printf 'tools_image=%s\n' "$image/tools@$(jq -r '.["containerimage.digest"]' "$RUNNER_TEMP/tools.json")" >> "$GITHUB_OUTPUT"
      - name: Cerrar sesión del registro
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Actualizar EC2
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    concurrency:
      group: ec2-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Acceso temporal a AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
          role-session-name: FitnessStuff-${{ github.run_id }}
      - name: Permitir SSH solo desde este runner
        id: ingress
        env:
          SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SECURITY_GROUP_ID" =~ ^sg-[a-f0-9]+$ ]]
          runner_ip=$(curl --fail --silent --show-error https://checkip.amazonaws.com | tr -d '[:space:]')
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          jq -n --arg cidr "$runner_ip/32" --arg description "FitnessStuff Actions $GITHUB_RUN_ID" \
            '[{IpProtocol:"tcp",FromPort:22,ToPort:22,IpRanges:[{CidrIp:$cidr,Description:$description}]}]' > "$RUNNER_TEMP/ingress.json"
          rule=$(aws ec2 authorize-security-group-ingress --group-id "$SECURITY_GROUP_ID" --ip-permissions "file://$RUNNER_TEMP/ingress.json" --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)
          [[ "$rule" =~ ^sgr-[a-f0-9]+$ ]]
          printf 'rule=%s\n' "$rule" >> "$GITHUB_OUTPUT"
      - name: Preparar conexión y versión
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          APP_IMAGE: ${{ needs.publish.outputs.app_image }}
          TOOLS_IMAGE: ${{ needs.publish.outputs.tools_image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_ENVIRONMENT" in
            production) deploy_root=/opt/fitness-stuff-production ;;
            staging) deploy_root=/opt/fitness-stuff ;;
            *) exit 1 ;;
          esac
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'EC2_HOST inválido o ausente'; exit 1; }
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'EC2_USER inválido o ausente'; exit 1; }
          [[ "$APP_IMAGE" =~ ^ghcr.io/[a-z0-9/_.-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "$TOOLS_IMAGE" =~ ^ghcr.io/[a-z0-9/_.-]+@sha256:[a-f0-9]{64}$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/ec2-release"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2-key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/ec2-known-hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ec2-key" > /dev/null
          cp deploy/compose.ec2.yaml deploy/nginx.conf deploy/deploy.sh "$RUNNER_TEMP/ec2-release/"
          printf 'APP_IMAGE=%s\nTOOLS_IMAGE=%s\n' "$APP_IMAGE" "$TOOLS_IMAGE" > "$RUNNER_TEMP/ec2-release/release.env"
          tar -czf "$RUNNER_TEMP/ec2-release.tgz" -C "$RUNNER_TEMP/ec2-release" .
          ssh_options=(-i "$RUNNER_TEMP/ec2-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ec2-known-hosts" -o ConnectTimeout=15)
          # Ruta privada por ejecución; el token de paquetes expira con el job.
          cleanup_registry() {
            # shellcheck disable=SC2029
            ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" "rm -f /opt/fitness-stuff/registry-$GITHUB_RUN_ID/config.json; rmdir /opt/fitness-stuff/registry-$GITHUB_RUN_ID 2>/dev/null || true" >/dev/null 2>&1 || true
          }
          trap cleanup_registry EXIT
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" "mkdir -p $deploy_root/incoming $deploy_root/releases"
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" "umask 077; mkdir -p /opt/fitness-stuff/registry-$GITHUB_RUN_ID; DOCKER_CONFIG=/opt/fitness-stuff/registry-$GITHUB_RUN_ID docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/ec2-release.tgz" "$EC2_USER@$EC2_HOST:$deploy_root/incoming/$GITHUB_SHA.tgz"
          # El SHA de GitHub se expande intencionalmente en el runner.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" \
            "set -eu; export DOCKER_CONFIG=/opt/fitness-stuff/registry-$GITHUB_RUN_ID DEPLOY_ROOT=$deploy_root; mkdir -p $deploy_root/releases/$GITHUB_SHA; tar -xzf $deploy_root/incoming/$GITHUB_SHA.tgz -C $deploy_root/releases/$GITHUB_SHA; bash $deploy_root/releases/$GITHUB_SHA/deploy.sh $GITHUB_SHA"
      - name: Retirar la regla SSH de esta ejecución
        if: always() && steps.ingress.outputs.rule != ''
        env:
          SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          RULE_ID: ${{ steps.ingress.outputs.rule }}
        run: aws ec2 revoke-security-group-ingress --group-id "$SECURITY_GROUP_ID" --security-group-rule-ids "$RULE_ID"
      - name: Retirar credenciales del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/ec2-key" "$RUNNER_TEMP/ec2-known-hosts"
